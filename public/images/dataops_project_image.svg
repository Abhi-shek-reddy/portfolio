    <rect x="0" y="0" width="120" height="115" rx="10" fill="url(#green)" stroke="#34d399" stroke-width="1" stroke-opacity="0.45"/>
    <!-- DAG / flow icon -->
    <circle cx="36" cy="36" r="10" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.3" stroke-opacity="0.8"/>
    <circle cx="84" cy="36" r="10" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.3" stroke-opacity="0.8"/>
    <circle cx="60" cy="64" r="10" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.3" stroke-opacity="0.8"/>
