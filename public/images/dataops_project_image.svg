  <ellipse cx="180" cy="190" rx="80"  ry="60"  fill="#34d399" opacity="0.04" filter="url(#softglow)"/>
  <ellipse cx="620" cy="210" rx="80"  ry="60"  fill="#34d399" opacity="0.04" filter="url(#softglow)"/>

