    <rect x="0" y="0" width="148" height="70" rx="8" fill="url(#green)" stroke="#34d399" stroke-width="1" stroke-opacity="0.35"/>
    <!-- lineage chain -->
    <circle cx="24"  cy="30" r="7" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8"/>
    <line   x1="31" y1="30" x2="47" y2="30" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,2"/>
    <circle cx="54"  cy="30" r="7" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8"/>
    <line   x1="61" y1="30" x2="77" y2="30" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,2"/>
    <circle cx="84"  cy="30" r="7" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8"/>
    <line   x1="91" y1="30" x2="107" y2="30" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,2"/>
    <circle cx="114" cy="30" r="7" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8"/>
