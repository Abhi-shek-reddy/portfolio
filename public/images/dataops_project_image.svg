    <polyline points="50,48 57,56 72,40" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
    <text x="60" y="95"  fill="#34d399" font-size="8"   text-anchor="middle" opacity="0.9" letter-spacing="0.8">GREAT</text>
    <text x="60" y="107" fill="#34d399" font-size="8"   text-anchor="middle" opacity="0.9" letter-spacing="0.8">EXPECTATIONS</text>
