    <rect x="40" y="14" width="22" height="20" rx="3" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.1" stroke-opacity="0.75"/>
    <rect x="66" y="14" width="22" height="20" rx="3" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.1" stroke-opacity="0.75"/>
