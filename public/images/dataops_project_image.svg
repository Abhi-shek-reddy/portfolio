    <text x="30" y="39" fill="#34d399" font-size="9" text-anchor="middle" opacity="0.8">CI</text>
    <line x1="44" y1="35" x2="56" y2="35" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrG)"/>
    <circle cx="70" cy="35" r="14" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
