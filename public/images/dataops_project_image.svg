  <!-- Incident Prevention -->
  <g filter="url(#glow)" transform="translate(608,248)">
    <rect x="0" y="0" width="148" height="70" rx="8" fill="url(#green)" stroke="#34d399" stroke-width="1" stroke-opacity="0.35"/>
    <!-- alert bell icon -->
    <path d="M74 12 Q86 18 86 34 L90 44 L58 44 L62 34 Q62 18 74 12Z"
          fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.3" stroke-opacity="0.8"/>
    <line x1="70" y1="44" x2="78" y2="44" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="74" y="57" fill="#34d399" font-size="7.8" text-anchor="middle" opacity="0.85" letter-spacing="0.5">Incident Prevention</text>
    <text x="74" y="68" fill="rgba(52,211,153,0.6)" font-size="8" text-anchor="middle" font-weight="bold">3 bad-data events</text>
  </g>

  <!-- ── METRICS BOTTOM ── -->
  <line x1="40" y1="358" x2="760" y2="358" stroke="rgba(52,211,153,0.08)" stroke-width="1"/>

  <text x="130" y="385" fill="rgba(52,211,153,0.7)" font-size="14" text-anchor="middle" font-weight="bold">40%</text>
  <text x="130" y="400" fill="rgba(52,211,153,0.35)" font-size="8"  text-anchor="middle">Incidents Reduced</text>

  <text x="310" y="385" fill="rgba(52,211,153,0.7)" font-size="14" text-anchor="middle" font-weight="bold">30 min</text>
  <text x="310" y="400" fill="rgba(52,211,153,0.35)" font-size="8"  text-anchor="middle">MTTR (from 2 hrs)</text>

  <text x="490" y="385" fill="rgba(52,211,153,0.7)" font-size="14" text-anchor="middle" font-weight="bold">70%</text>
  <text x="490" y="400" fill="rgba(52,211,153,0.35)" font-size="8"  text-anchor="middle">CI Build Time Cut</text>

  <text x="660" y="385" fill="rgba(52,211,153,0.7)" font-size="14" text-anchor="middle" font-weight="bold">60%</text>
  <text x="660" y="400" fill="rgba(52,211,153,0.35)" font-size="8"  text-anchor="middle">Refresh Runtime Cut</text>

  <!-- bottom tag -->
  <text x="772" y="442" fill="rgba(52,211,153,0.2)" font-size="8" text-anchor="end" letter-spacing="1">DATAOPS · QUALITY · GOVERNANCE</text>
</svg>
