  <!-- arrow GE → dbt -->
  <line x1="190" y1="140" x2="248" y2="140" stroke="url(#arrowG)" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="219" y="133" fill="rgba(52,211,153,0.4)" font-size="7" text-anchor="middle">validate</text>

  <!-- Pillar 2: dbt -->
  <g filter="url(#glow)" transform="translate(252,82)">
    <rect x="0" y="0" width="120" height="115" rx="10" fill="url(#green)" stroke="#34d399" stroke-width="1" stroke-opacity="0.45"/>
    <!-- dbt diamond / transform icon -->
    <polygon points="60,20 82,42 60,64 38,42" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.4" stroke-opacity="0.8"/>
    <circle cx="60" cy="42" r="8" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.9"/>
    <text x="60" y="85"  fill="#34d399" font-size="9.5" text-anchor="middle" opacity="0.9" letter-spacing="1" font-weight="bold">dbt</text>
    <text x="60" y="97"  fill="#34d399" font-size="7.5" text-anchor="middle" opacity="0.7" letter-spacing="0.5">Schema Tests</text>
