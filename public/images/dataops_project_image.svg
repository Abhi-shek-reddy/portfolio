    <text x="110" y="22" fill="#34d399" font-size="8"   text-anchor="start" opacity="0.8">Docker</text>
    <text x="110" y="34" fill="#34d399" font-size="8"   text-anchor="start" opacity="0.8">Terraform</text>
    <text x="74" y="55" fill="#34d399" font-size="8"   text-anchor="middle" opacity="0.85" letter-spacing="0.5">Infrastructure as Code</text>
    <text x="74" y="66" fill="rgba(52,211,153,0.45)" font-size="7" text-anchor="middle" letter-spacing="0.5">containerised · reproducible</text>
