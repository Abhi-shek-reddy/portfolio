<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="font-family:'Space Mono',monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#05090e"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="arrowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="arrowV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399" opacity="0.85"/>
    </marker>
    <marker id="arrGV" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399" opacity="0.85"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="rgba(52,211,153,0.04)" stroke-width="1">
    <line x1="0" y1="44"  x2="800" y2="44"/> <line x1="0" y1="88"  x2="800" y2="88"/>
    <line x1="0" y1="132" x2="800" y2="132"/> <line x1="0" y1="176" x2="800" y2="176"/>
    <line x1="0" y1="220" x2="800" y2="220"/> <line x1="0" y1="264" x2="800" y2="264"/>
    <line x1="0" y1="308" x2="800" y2="308"/> <line x1="0" y1="352" x2="800" y2="352"/>
    <line x1="0" y1="396" x2="800" y2="396"/>
    <line x1="44"  y1="0" x2="44"  y2="450"/> <line x1="88"  y1="0" x2="88"  y2="450"/>
    <line x1="132" y1="0" x2="132" y2="450"/> <line x1="176" y1="0" x2="176" y2="450"/>
    <line x1="220" y1="0" x2="220" y2="450"/> <line x1="264" y1="0" x2="264" y2="450"/>
    <line x1="308" y1="0" x2="308" y2="450"/> <line x1="352" y1="0" x2="352" y2="450"/>
    <line x1="396" y1="0" x2="396" y2="450"/> <line x1="440" y1="0" x2="440" y2="450"/>
    <line x1="484" y1="0" x2="484" y2="450"/> <line x1="528" y1="0" x2="528" y2="450"/>
    <line x1="572" y1="0" x2="572" y2="450"/> <line x1="616" y1="0" x2="616" y2="450"/>
    <line x1="660" y1="0" x2="660" y2="450"/> <line x1="704" y1="0" x2="704" y2="450"/>
    <line x1="748" y1="0" x2="748" y2="450"/>
