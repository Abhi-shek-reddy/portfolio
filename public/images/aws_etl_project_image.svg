<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="font-family:'Space Mono',monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#05090e"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9a8d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f9a8d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f9a8d4" opacity="0.8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- grid lines -->
  <g stroke="rgba(249,168,212,0.04)" stroke-width="1">
    <line x1="0" y1="44" x2="800" y2="44"/>
    <line x1="0" y1="88" x2="800" y2="88"/>
    <line x1="0" y1="132" x2="800" y2="132"/>
    <line x1="0" y1="176" x2="800" y2="176"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="264" x2="800" y2="264"/>
    <line x1="0" y1="308" x2="800" y2="308"/>
    <line x1="0" y1="352" x2="800" y2="352"/>
    <line x1="0" y1="396" x2="800" y2="396"/>
    <line x1="44"  y1="0" x2="44"  y2="450"/>
    <line x1="88"  y1="0" x2="88"  y2="450"/>
    <line x1="132" y1="0" x2="132" y2="450"/>
    <line x1="176" y1="0" x2="176" y2="450"/>
    <line x1="220" y1="0" x2="220" y2="450"/>
    <line x1="264" y1="0" x2="264" y2="450"/>
    <line x1="308" y1="0" x2="308" y2="450"/>
    <line x1="352" y1="0" x2="352" y2="450"/>
    <line x1="396" y1="0" x2="396" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/>
    <line x1="484" y1="0" x2="484" y2="450"/>
    <line x1="528" y1="0" x2="528" y2="450"/>
    <line x1="572" y1="0" x2="572" y2="450"/>
    <line x1="616" y1="0" x2="616" y2="450"/>
    <line x1="660" y1="0" x2="660" y2="450"/>
    <line x1="704" y1="0" x2="704" y2="450"/>
    <line x1="748" y1="0" x2="748" y2="450"/>
  </g>

  <!-- soft pink glow blobs -->
  <ellipse cx="150" cy="225" rx="100" ry="80" fill="#f9a8d4" opacity="0.04" filter="url(#softglow)"/>
  <ellipse cx="650" cy="225" rx="100" ry="80" fill="#f9a8d4" opacity="0.04" filter="url(#softglow)"/>

  <!-- section label top left -->
  <text x="28" y="32" fill="#f9a8d4" font-size="10" opacity="0.5" letter-spacing="2">05 / AWS MULTI-CLOUD ETL PLATFORM</text>

  <!-- pipeline flow label -->
  <text x="400" y="70" fill="rgba(249,168,212,0.35)" font-size="9" text-anchor="middle" letter-spacing="3">DATA FLOW ARCHITECTURE</text>

  <!-- ── PIPELINE NODES ── -->

  <!-- Node 1: S3 Data Lake -->
  <g filter="url(#glow)" transform="translate(78,170)">
    <rect x="0" y="0" width="110" height="110" rx="10" fill="url(#pink)" stroke="#f9a8d4" stroke-width="1" stroke-opacity="0.4"/>
    <!-- S3 bucket icon -->
    <ellipse cx="55" cy="28" rx="30" ry="10" fill="none" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="25" y1="28" x2="25" y2="60" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="85" y1="28" x2="85" y2="60" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <ellipse cx="55" cy="60" rx="30" ry="10" fill="rgba(249,168,212,0.15)" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="55" y="88" fill="#f9a8d4" font-size="9" text-anchor="middle" opacity="0.9" letter-spacing="1">AWS S3</text>
    <text x="55" y="101" fill="rgba(249,168,212,0.5)" font-size="7.5" text-anchor="middle" letter-spacing="0.5">Data Lake</text>
  </g>

  <!-- Arrow S3 → Glue -->
  <line x1="190" y1="225" x2="248" y2="225" stroke="url(#arrow)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="219" y="218" fill="rgba(249,168,212,0.4)" font-size="7.5" text-anchor="middle">ingest</text>

  <!-- Node 2: AWS Glue -->
  <g filter="url(#glow)" transform="translate(252,170)">
    <rect x="0" y="0" width="110" height="110" rx="10" fill="url(#pink)" stroke="#f9a8d4" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Glue gear icon -->
    <circle cx="55" cy="42" r="20" fill="none" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="55" cy="42" r="10" fill="rgba(249,168,212,0.15)" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="55" y1="18" x2="55" y2="24" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="55" y1="60" x2="55" y2="66" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="31" y1="42" x2="37" y2="42" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="73" y1="42" x2="79" y2="42" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="38" y1="25" x2="42" y2="29" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="68" y1="55" x2="72" y2="59" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="72" y1="25" x2="68" y2="29" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="42" y1="55" x2="38" y2="59" stroke="#f9a8d4" stroke-width="2" stroke-opacity="0.7"/>
    <text x="55" y="88" fill="#f9a8d4" font-size="9" text-anchor="middle" opacity="0.9" letter-spacing="1">AWS GLUE</text>
    <text x="55" y="101" fill="rgba(249,168,212,0.5)" font-size="7.5" text-anchor="middle" letter-spacing="0.5">ETL · Catalog</text>
  </g>

  <!-- Arrow Glue → EMR -->
  <line x1="364" y1="225" x2="422" y2="225" stroke="url(#arrow)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="393" y="218" fill="rgba(249,168,212,0.4)" font-size="7.5" text-anchor="middle">transform</text>

  <!-- Node 3: EMR / PySpark -->
  <g filter="url(#glow)" transform="translate(426,170)">
    <rect x="0" y="0" width="110" height="110" rx="10" fill="url(#pink)" stroke="#f9a8d4" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Spark flame icon -->
    <path d="M55 20 Q60 30 52 36 Q65 28 62 44 Q70 36 65 50 Q72 42 68 56 Q55 48 55 62 Q48 50 52 42 Q44 50 48 36 Q42 28 55 20Z"
          fill="rgba(249,168,212,0.25)" stroke="#f9a8d4" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="55" y="88" fill="#f9a8d4" font-size="9" text-anchor="middle" opacity="0.9" letter-spacing="1">AWS EMR</text>
    <text x="55" y="101" fill="rgba(249,168,212,0.5)" font-size="7.5" text-anchor="middle" letter-spacing="0.5">PySpark</text>
  </g>

  <!-- Arrow EMR → Redshift -->
  <line x1="538" y1="225" x2="596" y2="225" stroke="url(#arrow)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="567" y="218" fill="rgba(249,168,212,0.4)" font-size="7.5" text-anchor="middle">load</text>

  <!-- Node 4: Redshift -->
  <g filter="url(#glow)" transform="translate(600,170)">
    <rect x="0" y="0" width="110" height="110" rx="10" fill="url(#pink)" stroke="#f9a8d4" stroke-width="1" stroke-opacity="0.4"/>
    <!-- DB cylinder icon -->
    <ellipse cx="55" cy="30" rx="28" ry="9" fill="rgba(249,168,212,0.15)" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="27" y1="30" x2="27" y2="56" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="83" y1="30" x2="83" y2="56" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <ellipse cx="55" cy="44" rx="28" ry="9" fill="none" stroke="#f9a8d4" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>
    <ellipse cx="55" cy="56" rx="28" ry="9" fill="rgba(249,168,212,0.15)" stroke="#f9a8d4" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="55" y="82" fill="#f9a8d4" font-size="9" text-anchor="middle" opacity="0.9" letter-spacing="1">REDSHIFT</text>
    <text x="55" y="95" fill="rgba(249,168,212,0.5)" font-size="7.5" text-anchor="middle" letter-spacing="0.5">Warehouse</text>
  </g>

  <!-- ── BOTTOM TECH ROW ── -->
  <line x1="40" y1="332" x2="760" y2="332" stroke="rgba(249,168,212,0.1)" stroke-width="1"/>

  <!-- Lambda -->
  <g transform="translate(100,348)">
    <rect x="0" y="0" width="80" height="26" rx="4" fill="rgba(249,168,212,0.06)" stroke="rgba(249,168,212,0.2)" stroke-width="1"/>
    <text x="40" y="17" fill="#f9a8d4" font-size="8" text-anchor="middle" opacity="0.7" letter-spacing="0.5">λ Lambda</text>
  </g>

  <!-- Step Functions -->
  <g transform="translate(210,348)">
    <rect x="0" y="0" width="100" height="26" rx="4" fill="rgba(249,168,212,0.06)" stroke="rgba(249,168,212,0.2)" stroke-width="1"/>
    <text x="50" y="17" fill="#f9a8d4" font-size="8" text-anchor="middle" opacity="0.7" letter-spacing="0.5">Step Functions</text>
  </g>

  <!-- Terraform -->
  <g transform="translate(340,348)">
    <rect x="0" y="0" width="80" height="26" rx="4" fill="rgba(249,168,212,0.06)" stroke="rgba(249,168,212,0.2)" stroke-width="1"/>
    <text x="40" y="17" fill="#f9a8d4" font-size="8" text-anchor="middle" opacity="0.7" letter-spacing="0.5">Terraform</text>
  </g>

  <!-- Docker -->
  <g transform="translate(450,348)">
    <rect x="0" y="0" width="70" height="26" rx="4" fill="rgba(249,168,212,0.06)" stroke="rgba(249,168,212,0.2)" stroke-width="1"/>
    <text x="35" y="17" fill="#f9a8d4" font-size="8" text-anchor="middle" opacity="0.7" letter-spacing="0.5">Docker</text>
  </g>

  <!-- GitHub Actions -->
  <g transform="translate(550,348)">
    <rect x="0" y="0" width="110" height="26" rx="4" fill="rgba(249,168,212,0.06)" stroke="rgba(249,168,212,0.2)" stroke-width="1"/>
    <text x="55" y="17" fill="#f9a8d4" font-size="8" text-anchor="middle" opacity="0.7" letter-spacing="0.5">GitHub Actions CI/CD</text>
  </g>

  <!-- ── METRICS ROW ── -->
  <text x="138" y="416" fill="rgba(249,168,212,0.6)" font-size="11" text-anchor="middle" font-weight="bold">TB-scale</text>
  <text x="138" y="430" fill="rgba(249,168,212,0.35)" font-size="8" text-anchor="middle">Daily Ingestion</text>

  <text x="310" y="416" fill="rgba(249,168,212,0.6)" font-size="11" text-anchor="middle" font-weight="bold">85%</text>
  <text x="310" y="430" fill="rgba(249,168,212,0.35)" font-size="8" text-anchor="middle">Deploy Effort Cut</text>

  <text x="490" y="416" fill="rgba(249,168,212,0.6)" font-size="11" text-anchor="middle" font-weight="bold">Sub-hour</text>
  <text x="490" y="430" fill="rgba(249,168,212,0.35)" font-size="8" text-anchor="middle">SLA Compliance</text>

  <text x="662" y="416" fill="rgba(249,168,212,0.6)" font-size="11" text-anchor="middle" font-weight="bold">IaC</text>
  <text x="662" y="430" fill="rgba(249,168,212,0.35)" font-size="8" text-anchor="middle">Full Terraform</text>

  <!-- bottom right watermark -->
  <text x="772" y="442" fill="rgba(249,168,212,0.2)" font-size="8" text-anchor="end" letter-spacing="1">AWS · ETL · PIPELINE</text>
</svg>
